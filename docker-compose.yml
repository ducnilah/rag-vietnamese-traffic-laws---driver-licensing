services:
  api:
    build: .
    ports:
      - "8010:8010"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    depends_on:
      - postgres

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: traffic_rag_v2
    ports:
      - "5433:5432"
    volumes:
      - traffic_rag_v2_pg:/var/lib/postgresql/data

volumes:
  traffic_rag_v2_pg:
